name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint / Type / Test / Security
    runs-on: ubuntu-latest

    env:
      # Sync ONCE explicitly below (with --extra cpu, --locked); UV_NO_SYNC then keeps
      # every `uv run` step on that exact, lock-verified env. Without it, a plain
      # `uv run` on Linux re-resolves torch WITHOUT the cpu extra and pulls the heavy
      # PyPI CUDA wheel. CI MUST stay on +cpu and MUST NEVER select --extra cu130
      # (the cu130 wheel segfaults on a GPU-less box). See docs/specs/torch-backend-per-machine.md.
      UV_NO_SYNC: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        # --extra cpu → the lean +cpu torch wheel from the pytorch-cpu index (never cu130).
        # --locked → fail if uv.lock is stale vs pyproject (no silent re-resolve in CI).
        run: uv sync --locked --extra cpu --extra dev

      # --- Lint ---
      - name: Ruff lint
        run: uv run ruff check src/ tests/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/

      # --- Types ---
      - name: mypy
        run: uv run mypy src/

      # --- Tests (unit only — no API calls, no cost) ---
      - name: pytest with coverage
        run: uv run pytest tests/unit/ tests/integration/ --cov=src --cov-report=term-missing --cov-fail-under=40 --ignore=tests/eval/

      # --- Security ---
      - name: bandit SAST
        run: uv run bandit -r src/ -c pyproject.toml

      - name: pip-audit (advisory)
        continue-on-error: true
        run: uv run pip-audit

      - name: detect-secrets
        run: uv run detect-secrets scan --baseline .secrets.baseline

  # The desktop app is half the product and CI did not touch it until 2026-08-06: `npm test`
  # (node:test over the pure `lib/**/*.ts` modules) and `svelte-check` ran on a developer's machine
  # or not at all. Both are seconds long and need no Python, so they get their own job — a red
  # frontend must not be reported as a green build.
  frontend:
    name: Frontend — Types / Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # node:test runs the .ts sources directly via native type stripping — no bundler, no
          # ts-node, no extra dependency. That needs a modern Node; 22 is the floor.
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install dependencies
        # `npm ci` (not `install`) → installs exactly the lockfile, and fails if it is stale.
        # Same discipline as `uv sync --locked` in the job above.
        run: npm ci

      - name: svelte-check
        run: npm run check

      - name: Unit tests
        run: npm test

  # The container is the third way this project ships (desktop installer · source checkout ·
  # headless image) and it was the only one nothing verified: no job here referenced the Dockerfile
  # between 2026-08-01 and 2026-09-04. In that window `uv sync --locked` could have gone stale in
  # the image, or the pinned uv base tag could have vanished, and it would have surfaced only when
  # somebody actually needed the container — which is where it was found (DEVLOG 2026-09-04).
  docker:
    name: Docker — Headless API image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The image is ~6.3 GB and a hosted runner has little more than that spare once the build
      # cache is written too. These two directories are the largest things preinstalled that this
      # job cannot use; dropping them buys ~10 GB and costs a few seconds.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: doc-assistant:ci
          # The dependency layer takes ~8 min to resolve and install, and the Dockerfile copies
          # pyproject.toml + uv.lock before anything else precisely so it can be cached. Without
          # this the job would pay that on every push to every branch.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A green build says the layers assembled. It does not say the image is the right one.
      - name: The image must carry CPU torch, never CUDA
        # The trap the Dockerfile documents at length: `pip install ".[cpu]"` ignores
        # [tool.uv.sources], resolves torch from PyPI, and that Linux wheel bundles CUDA — several
        # GB of nvidia-* packages in an image with no GPU. It still builds and still runs, so
        # nothing else in this file would notice. Measured on the working image: 2.12.0+cpu, 0 nvidia-*.
        #
        # Asked of the package metadata, not of a site-packages listing. The first draft was
        # `ls /app/.venv/lib/python*/site-packages | grep -c "^nvidia" || true`, which reports 0 —
        # a pass — when the glob matches nothing at all, so relocating the venv would have turned
        # this check off silently rather than failing. A check that cannot tell "none present"
        # from "could not look" is worse than no check.
        #
        # Block scalar, not a plain one: these commands contain ": " inside f-strings, which YAML
        # reads as a mapping key in an unquoted value. Written inline first, and it made the whole
        # workflow unparseable.
        run: |
          docker run --rm doc-assistant:ci uv run --no-sync python -c 'import torch, importlib.metadata as md; assert torch.__version__.endswith("+cpu"), f"expected a +cpu wheel, got {torch.__version__}"; nv = sorted(n for d in md.distributions() if (n := (d.metadata["Name"] or "")).startswith("nvidia")); assert not nv, f"nvidia packages in the image: {nv}"; print("torch", torch.__version__, "| nvidia packages: 0")'

      - name: The app must import inside the image
        # KI-34 is the standing lesson here: a shipped artifact that started cleanly, served
        # /api/health, reported a healthy chunk count — and could not read a single PDF. Importing
        # is a floor, not a proof, but it is the cheapest check that the CMD would get anywhere.
        # Booting to a green /api/health is deliberately NOT done: first run downloads the embedder
        # and reranker, which is why the Dockerfile's HEALTHCHECK has a 300 s start period.
        run: |
          docker run --rm doc-assistant:ci uv run --no-sync python -c 'import apps.api, doc_assistant; print("apps.api ok; doc_assistant", doc_assistant.__version__)'
