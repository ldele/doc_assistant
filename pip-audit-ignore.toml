[[ignore]]
id = "PYSEC-2026-3815"  # CVE-2026-45831 · GHSA-xph7-9rjv-w5fr
package = "chromadb"
reviewed = "2026-09-30"
why = """Server-side only: the server's SimpleRBACAuthorizationProvider ignores which tenant a \
permission applies to. The embedded client configures no authorization provider. No fixed \
release exists."""
reverse_if = "A Chroma server with an authorization provider is deployed; or a fixed chromadb is released."

[[ignore]]
id = "PYSEC-2026-3447"  # CVE-2026-59890 · GHSA-h35f-9h28-mq5c
package = "setuptools"
reviewed = "2026-09-30"
why = """Build-time only, and only on macOS APFS/HFS+: a MANIFEST.in exclusion can miss an \
NFD-named file when an sdist is built. This project publishes no sdist (it ships an installer, a \
Docker image and a git tag), builds on Windows, and its build backend resolves setuptools in an \
isolated build environment, not from this lock. The locked copy is a runtime dependency of torch \
2.12, which requires setuptools<82; the fix (83.0.0) needs torch 2.14."""
reverse_if = "The project publishes an sdist, or builds one on macOS; or torch lifts its setuptools<82 cap (then upgrade)."
