# Reviewed pip-audit ignores — security step S-8 (docs/security.md §4), since 2026-09-30.
#
# `python -m scripts.pip_audit_gate` (CI, and `just audit`) fails on any advisory that is NOT
# listed here, and refuses an entry that lacks any of the fields below. An entry whose advisory no
# longer appears is reported as stale: delete it. An advisory is matched by its id or any of its
# aliases, and only for the package named.
#
# To add one: read the advisory, check it against how THIS code uses the package, and write down
# why it does not apply and what would make it apply. "Upgrade later" is not a reason.

[[ignore]]
id = "PYSEC-2026-311"  # CVE-2026-45829 · GHSA-f4j7-r4q5-qw2c
package = "chromadb"
reviewed = "2026-09-30"
why = """Server-side only: pre-authentication code injection through the Chroma HTTP server's \
collection endpoint. This app embeds Chroma in-process (chromadb.PersistentClient and langchain's \
Chroma(persist_directory=...)); no Chroma server runs and nothing in src/, apps/ or scripts/ uses \
chromadb.HttpClient. No fixed release exists."""
reverse_if = "Anything starts a Chroma server or uses chromadb.HttpClient; or a fixed chromadb is released (then upgrade)."

[[ignore]]
id = "PYSEC-2026-3813"  # CVE-2026-45830 · GHSA-2wm9-hf6c-p5cr
package = "chromadb"
reviewed = "2026-09-30"
why = """Server-side only: missing tenant checks let an authenticated server user reach another \
tenant's collections. The embedded client has no tenants, users or network surface. No fixed \
release exists."""
reverse_if = "Anything starts a Chroma server, or the library is shared between users through one; or a fixed chromadb is released."

[[ignore]]
