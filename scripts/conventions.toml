# Config for the vendored cpc gates (docs_check, sprint_check, keypoint, …). Tune per project;
# do not silently raise to pass. Laid by cpc-init (standard profile); refreshed to the cpc 1.2.3
# key set on 2026-07-19 (ADR-021) with this project's tuned values preserved.

[cpc]
# The init profile this project was laid at (read by cpc-init-check, the completeness gate).
profile = "standard"

[budgets]
entry_max_lines        = 600   # docs_check: root entry file (AGENTS.md) + .claude/CONTEXT.md combined
module_claude_max_lines = 40   # docs_check: each <module>/CLAUDE.md
session_max_entries    = 10    # docs_check rule 11b (cpc ADR-018): baton cap; rotate older entries
                               # verbatim to docs/archive/SESSION-archive-NNN.md (local-only here)
devlog_max_entries     = 20    # docs_check rule 13b (cpc ADR-023): DEVLOG keeps the newest 20 entries;
                               # rotate the rest verbatim with `rotate.py --file devlog --write` (user standard, 2026-09-10)
uses_max_files         = 12    # sprint_check: resolved `uses` read-set files (globs expanded)
uses_max_lines         = 2500  # sprint_check: summed line count of resolved `uses` files
# Token budgets (0 = off) — calibrate before enabling.
entry_max_tokens       = 0
uses_max_tokens        = 0

[uses]
# sprint_check: `uses` ⊇ `affects` coherence (you must read what you change).
superset_affects = "warn"

[staleness]
disposable_days = 90           # PLAN_/REVIEW_ still 'active' older than this -> flagged
living_bump = "warn"           # rule 12 (cpc ADR-018): living doc edited without bumping updated:

[headers]
# globs (relative to root) exempt from the status-header requirement
# .claude/commands/* are slash-command PROMPTS, not coordination docs — a governance header
# would be injected into every command invocation as prompt noise.
exempt = ["docs/specs/**", "**/*.json", ".claude/commands/**"]

[routes]
# extensions treated as route targets when found inside `backticks`
extensions = [".md"]
check_md_links = true     # rule 4b: markdown [text](target) links in entry/.claude files must resolve
check_adr_refs = false

[entry]
# stub-stays-stub (cpc ADR-014, rule 9): AGENTS.md is canonical here (project ADR-021), so root
# CLAUDE.md must stay a bare `@AGENTS.md` import — entry content belongs in AGENTS.md.
enforce_stub = true

[plan]
require_prior_art = false

[generate]
# Derived artifacts regenerated before handoff (cpc ADR-013). None registered yet.

[keypoints]
# Per-project extras per boundary: [keypoints.<name>] run = [...] / checklist = [...].

[keypoints.session-start]
# CI on `main` was red for five days and seven pushes (2026-09-02 → 09-07) while three batons said
# "every gate green locally" — the third instance of the CI-blind shape (KI-58). Print the last run
# where the next session cannot miss it. `gh` prints and exits 0 whether the run is green or red, so
# this line makes the state VISIBLE; reading the verdict is the checklist item below. Offline it
# fails the floor, which is the honest outcome — you do not know the state of `main`.
run = ["gh run list --branch main --limit 1"]
checklist = ["Read the `gh run list` line above: if it is not `completed success`, the failed log names the test — fix that before anything else (KI-58)."]

[keypoints.sprint-close]
# The security floor and the UX walkthrough are judgment items here, not `run` lines, on purpose:
# `pip-audit` reports 66 known advisories today (ROADMAP 61) and would fail every close until they
# are triaged, and the walkthrough needs a person and an installed build. Both become deterministic
# when their rows land (docs/security.md §4, docs/release-ux-checklist.md).
checklist = [
  "Security floor (docs/security.md §4): `uv run --no-sync pip-audit` · `npm --prefix apps/desktop audit --audit-level=high` · `uv run --no-sync bandit -r src apps -c pyproject.toml -q` — read the output; a new HIGH is a row in §3, not a shrug.",
  "If this close precedes a release: drive docs/release-ux-checklist.md on the installed build and fill its record table into .claude/release-notes-X.Y.Z.md.",
]

[test_api]
# cpc-test-api-check (CONVENTIONS §13, ADR-007): keep paid/live API calls out of tests.
# This codebase is provider-agnostic, so the bare substrings "anthropic" / "openai" match
# the provider *name used as data* all over the suite — make_client("anthropic", ...),
# monkeypatch.setattr(config, "REVIEWER_PROVIDER", "anthropic"), `"anthropic" in
# PAID_PROVIDERS`, the make_client("openai", ...) unknown-provider ValueError test — and
# the monkeypatch targets that *isolate* the SDKs. None of those are live calls. Drop the
# two coarse substrings and re-add the precise *live-construction* shapes, so a genuinely
# un-mocked SDK / LangChain client still trips the gate while the provider-name-as-data
# noise does not. The default requests./httpx./urllib.request/boto3/.client( patterns
# stay in force. A line that truly must construct a live client carries `cpc: allow-live-api`
# (currently only the intentional eval judge in tests/eval/run_eval.py).
allow_patterns = ["anthropic", "openai"]
extra_patterns = ["anthropic.Anthropic(", "openai.OpenAI(", "ChatAnthropic(", "ChatOpenAI("]
